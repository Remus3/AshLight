[pytest]
testpaths = tests
# TEST-PLUGIN-PIN: the suite never depends on what the interpreter auto-loads.
# xdist stays loadable; a -p no: for an absent plugin is a no-op.
addopts = -p no:cacheprovider -p no:anyio -p no:asyncio -p no:timeout
# slow, server, git and discovery are registered in tests/conftest.py.
markers =
    timing: wall-clock sensitive; never in an ungated subset
    calc: starts the live calc (optional calc component)
    xdist_group: pytest-xdist loadgroup key (registered so a machine without xdist shows no unknown-mark warning)
# TEST-SLOW-BUDGET: a hung test ends after 120 s with every thread's traceback
# (core pytest; the exit option needs pytest 9.0 or newer).
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true
