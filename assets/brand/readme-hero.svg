<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="400" viewBox="0 0 1280 400">
  <!-- AshLight README hero (BRAND-ICON, docs/design/0005-brand-mark.md).
       The mark, the word AshLight and the tagline, all drawn as own
       monoline strokes: no font file, no font licence, no game art.
       Light by default; prefers-color-scheme: dark swaps the ground and
       ink. tools/make_icons.py renders readme-hero-light.png and
       readme-hero-dark.png from this file. -->
  <title>AshLight - a live, glanceable companion for Path of Exile 2</title>
