    .al-rule { stroke: #d3d8de; }
    .al-ink { stroke: #1a1d21; }
    .al-tag { stroke: #555d66; }
    @media (prefers-color-scheme: dark) {
      .al-ground { fill: #0f1216; }
      .al-rule { stroke: #323840; }
      .al-ink { stroke: #e4e8ec; }
      .al-tag { stroke: #99a1aa; }
    }
  </style>
