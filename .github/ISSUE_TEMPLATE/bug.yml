name: Bug report
description: Something in AshLight does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never attach Client.txt, game files, memory dumps or screenshots of the game.
        The redacted Checks report below has everything needed to start.
  - type: input
    id: version
    attributes:
      label: AshLight version
      description: Shown in the dashboard footer and at the top of the Checks report.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 23H2 or Windows 10 22H2.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what AshLight did instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Checks report
      description: In the dashboard, open Checks and click Copy report, then paste it here. The report is redacted; read it before pasting.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: Before you send
      options:
        - label: I read the report before pasting it.
          required: true
  - type: textarea
    id: shapes
    attributes:
      label: Ledger shape list (optional, English clients only)
      description: Only if the Checks report offers it. It lists line shapes, never the lines themselves.
      render: text
    validations:
      required: false
